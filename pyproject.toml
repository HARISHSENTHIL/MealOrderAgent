[project]
name = "foodorder"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "anthropic>=1.9.0",
    "cryptography>=50.0.2",
    "mcp>=1.10",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=21",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "tzdata>=2026.4",
]

[project.scripts]
foodorder = "foodorder.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
